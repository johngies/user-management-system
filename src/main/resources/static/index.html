<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Homepage</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    </head>
    <body>
        <div id="view-homepage">
            <h1>Homepage</h1>
            <button id="register-btn">Register new user</button>
            <button id="display-btn">Display Users</button>
        </div>
        <div id="view-register-edit">
            <h1 id="register-edit-h1"></h1>
            <form id="register-edit-form">
                <div class="form-group">
                    <label for="name-input">Name</label><br>
                    <input type="text" id="name-input" required>
                </div>
                <div class="form-group">
                    <label for="surname-input">Surname</label><br>
                    <input type="text" id="surname-input" required>
                </div>
                <div class="form-group">
                    <label for="gender-input">Gender</label><br>
                    <select id="gender-select" required>
                        <option value="" disabled selected>-- Select gender --</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="birthdate-input">Birthdate</label><br>
                    <input type="text" id="birthdate-input" required readonly placeholder="Select birthdate...">
                </div>
                <div class="form-group">
                    <label for="home-address-input">Home address</label><br>
                    <textarea id="home-address-input" rows="3" cols="40"></textarea>
                </div>
                <div class="form-group">
                    <label for="work-address-input">Work address</label><br>
                    <textarea id="work-address-input" rows="3" cols="40"></textarea>
                </div><br>
                <div>
                    <button type="submit" id="submit-btn">Submit</button>
                    <button type="button" id="cancel-btn">Cancel</button>
                    <button type="button" id="register-home-btn">Back to homepage</button> 
                </div>
                <p id="register-edit-success-msg" class="msg-success"></p>
                <p id="register-edit-error-msg" class="msg-error"></p>
            </form>
        </div>
        <div id="view-display-users">
            <h1>Users</h1>
            <div class="table-container">
                <table border="1">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Surname</th>
                            <th class="actions-col">Actions</th>
                        </tr>
                    </thead> 
                    <tbody id="users-tbody">
                        
                    </tbody>
                </table>
            </div>
            <div>
                <button id="users-home-btn">Back to homepage</button>
            </div>
            <p id="users-success-msg" class="msg-success"></p>
            <p id="users-error-msg" class="msg-error"></p>
        </div>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
        <script src="js/app.js"></script>
    </body>  
</html>
