<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>User Details</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <h1>User Details</h1>
        
        <div class="user-details-card">
            <p><strong>Name:</strong> <span id="detail-name"></span></p>
            <p><strong>Surname:</strong> <span id="detail-surname"></span></p>
            <p><strong>Gender:</strong> <span id="detail-gender"></span></p>
            <p><strong>Birthdate:</strong> <span id="detail-birthdate"></span></p>
            <p><strong>Home Address:</strong> <span id="detail-home-address"></span></p>
            <p><strong>Work Address:</strong> <span id="detail-work-address"></span></p>
        </div>

        <div>
            <button onclick="window.close()">Close window</button>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="js/details.js"></script>
    </body>
    
</html>
